      if (/KAKAOTALK/i.test(navigator.userAgent)) {
        document.documentElement.classList.add('kakao-browser');
      }

  </head>
  <body>
    <main class="invitation" aria-label="졸업전시 모바일 초대장">
      <button
        class="poster-slot"
        type="button"
        aria-label="초대장 뒷면 보기"
        aria-pressed="false"
      >
        <span class="card">
          <span class="card-face card-front">
            <video
              class="invitation-video"
              src="assets/invitation-mobile.mp4"
              poster="assets/invitation-poster.png"
              autoplay
              muted
              loop
              playsinline
              webkit-playsinline
              preload="auto"
              disablepictureinpicture
              disableremoteplayback
              tabindex="-1"
              aria-hidden="true"
            >
              브라우저에서 영상을 재생할 수 없습니다.
            </video>
            <img
              class="invitation-fallback"
              data-src="assets/invitation-loop-30fps.webp"
              data-gif-src="assets/invitation-loop-20fps.gif"
              alt=""
              aria-hidden="true"
              draggable="false"
            />
          </span>
          <span class="card-face card-back">
            <img
              src="assets/invitation-back-standby.png"
              alt="졸업전시 초대장 뒷면: 전시 소개, 장소, 일정 및 후원사"
              draggable="false"
            />
          </span>
        </span>
      </button>
    </main>
    <script src="script.js?v=20261014-3"></script>
  </body>

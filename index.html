<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>졸업전시 모바일 초대장</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="invitation" aria-label="졸업전시 모바일 초대장">
      <button
        class="poster-slot"
        type="button"
        aria-label="초대장 뒷면 보기"
        aria-pressed="false"
      >
        <span class="card">
          <span class="card-face card-front">
            <video
              class="invitation-video"
              src="assets/invitation-mobile.mp4"
              poster="assets/invitation-poster.png"
              autoplay
              muted
              loop
              playsinline
              webkit-playsinline
              preload="auto"
              disablepictureinpicture
              disableremoteplayback
              tabindex="-1"
              aria-hidden="true"
            >
              브라우저에서 영상을 재생할 수 없습니다.
            </video>
          </span>
          <span class="card-face card-back">
            <img
              src="assets/invitation-back.png"
              alt="졸업전시 초대장 뒷면: 전시 소개, 장소, 일정 및 후원사"
              draggable="false"
            />
          </span>
        </span>
      </button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
